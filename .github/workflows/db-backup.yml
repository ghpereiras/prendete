name: Database backup

# Daily encrypted dump of the production database (Neon), stored as a workflow artifact
# that GitHub deletes after 14 days. Setup steps: DEPLOY.md > "Backups de la base".
on:
  schedule:
    - cron: "0 7 * * *" # 04:00 Argentina (UTC-3)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup

env:
  # Must be >= the Postgres major version of the Neon project (a newer pg_dump can
  # dump an older server, not the other way around). Check it in the Neon dashboard.
  PG_MAJOR: "18"
  RETENTION_DAYS: 14

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash # enables `set -eo pipefail`, so a failure inside a pipeline fails the step
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client and age
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-client-${PG_MAJOR}" age

      - name: Dump and encrypt
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
          OUT_DIR: ${{ runner.temp }}
        run: |
          # Separate assignment: a failing `$(...)` inside `echo` would not fail the step.
          file="$(scripts/backup_db.sh)"
          echo "BACKUP_FILE=$file" >> "$GITHUB_ENV"
          echo "BACKUP_NAME=$(basename "$file" .dump.age)" >> "$GITHUB_ENV"

      - name: Store backup as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_NAME }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error
          compression-level: 0 # already encrypted, so it doesn't compress

      - name: Ping healthcheck
        if: success()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL"; fi

      - name: Report failure to healthcheck
        if: failure()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL/fail" || true; fi
